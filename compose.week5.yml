name: itfpulse-week5

x-environment: &environment
  ITFPULSE_ConnectionStrings__ITFPulse: Host=postgres;Database=pulse;Username=pulse;Password=local-pulse-demo;Maximum Pool Size=40
  ITFPULSE_Messaging__Host: rabbitmq
  ITFPULSE_Messaging__Username: pulse
  ITFPULSE_Messaging__Password: local-pulse-demo
  Logging__LogLevel__Default: Warning
  Logging__LogLevel__MassTransit: Information

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: local-pulse-demo
    ports: ["127.0.0.1:5545:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 3s
      timeout: 3s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: pulse
      RABBITMQ_DEFAULT_PASS: local-pulse-demo
    ports: ["127.0.0.1:5675:5672", "127.0.0.1:15675:15672"]
    volumes: ["rabbit-data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
  initialize:
    build:
      context: ./backend
      args: { PROJECT: ITFPulse.Worker }
    image: itfpulse-week5-worker
    command: ["ITFPulse.Worker.dll", "--initialize"]
    environment: *environment
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
  api:
    build:
      context: ./backend
      args: { PROJECT: ITFPulse.Api }
    image: itfpulse-week5-api
    command: ["ITFPulse.Api.dll"]
    environment:
      <<: *environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ITFPULSE_Cors__AllowedOrigins__0: http://localhost:6510
    ports: ["127.0.0.1:5155:8080"]
    depends_on:
      initialize: { condition: service_completed_successfully }
  planner:
    image: itfpulse-week5-worker
    command: ["ITFPulse.Worker.dll"]
    environment:
      <<: *environment
      ITFPULSE_Messaging__Role: planner
    depends_on:
      initialize: { condition: service_completed_successfully }
  worker:
    image: itfpulse-week5-worker
    command: ["ITFPulse.Worker.dll"]
    environment:
      <<: *environment
      ITFPULSE_Messaging__Role: delivery
      ITFPULSE_Messaging__Concurrency: ${FEED_CONCURRENCY:-8}
      ITFPULSE_Messaging__Prefetch: ${FEED_PREFETCH:-16}
    depends_on:
      initialize: { condition: service_completed_successfully }

volumes:
  postgres-data:
  rabbit-data:
